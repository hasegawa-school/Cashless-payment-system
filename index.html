<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Noto Sans JP", sans-serif;
      text-align: center;
      margin: 0;
      padding: 24px 16px 80px;
      background: #f4f7fb;
      color: #172033;
    }
    h1 { margin: 0 0 16px; }
    .panel {
      width: min(520px, 100%);
      margin: 0 auto 16px;
      padding: 18px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }
    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }
    #scanMessage {
      margin: 12px 0 0;
      padding: 12px;
      border-radius: 12px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 20px;
      font-weight: bold;
    }
    .input-large {
      font-size: 32px;
      padding: 10px;
      width: 220px;
      max-width: 100%;
      text-align: center;
      border: 2px solid #b9c5d6;
      border-radius: 10px;
    }
    .button {
      font-size: 26px;
      padding: 12px 28px;
      margin-top: 14px;
      background: #007bff;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
    }
    .button:disabled { background: #888; cursor: not-allowed; }
    #result { font-size: 36px; font-weight: bold; }
    #salesToday { font-size: 24px; color: #444; }
    #pw-box {
      width: min(320px, calc(100% - 32px));
      margin: 18px auto 0;
    }
    #password {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      text-align: center;
      border: 1px solid #b9c5d6;
      border-radius: 10px;
    }
    .sub { color: #657084; }
    #copyright {
      position: fixed;
      bottom: 8px;
      left: 0;
      width: 100%;
      font-size: 12px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>キャッシュレス レジ</h1>

  <div id="card-area" class="panel">
    <h2>カードのQRを読み取ってください</h2>
    <p class="sub">カメラの枠の中にQRコードを映します。</p>
    <div id="reader"></div>
    <div id="scanMessage">カメラを準備しています…</div>
    <button id="cameraRetryBtn" class="button" style="display:none" onclick="startCamera()">
      カメラを再開
    </button>
  </div>

  <div id="salesToday" class="panel">このレジの今日の売上：0 円</div>

  <div id="pay-area" class="panel" style="display:none;">
    <h2 id="cardNumberDisplay"></h2>
    <h3>残高：<span id="balanceDisplay"></span> 円</h3>
    <input id="payment" type="number" inputmode="numeric" min="0" step="1"
      class="input-large" placeholder="お会計"
      onkeydown="if(event.key==='Enter') doPayment()">
    <br>
    <button id="payBtn" class="button" onclick="doPayment()">Pay</button>
    <button class="button" style="background:#64748b" onclick="cancelPayment()">もどる</button>
  </div>

  <div id="result" class="panel" style="display:none;"></div>

  <div id="pw-box">
    <input id="password" type="password" placeholder="レジPW">
  </div>

  <div id="copyright">© 2026 Hasegawa Konosuke. All rights reserved.</div>

  <script>
    let todaySales = 0;
    let currentCard = "";
    let scanner = null;
    let cameraRunning = false;
    let scanLocked = false;

    function runServer(functionName, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(error => reject(new Error(error.message || error)))
          [functionName](...args);
      });
    }

    async function startCamera() {
      if (cameraRunning) return;

      const password = document.getElementById("password").value;
      document.getElementById("cameraRetryBtn").style.display = "none";
      setScanMessage(password ? "カメラを起動しています…" : "左下のレジPWを入力してください。", false);

      try {
        if (!scanner) scanner = new Html5Qrcode("reader");
        const cameras = await Html5Qrcode.getCameras();
        if (!cameras.length) throw new Error("カメラが見つかりません。");

        const rearCamera = cameras.find(camera =>
          /back|rear|environment|背面/i.test(camera.label)
        );
        const cameraId = rearCamera ? rearCamera.id : cameras[0].id;

        await scanner.start(
          cameraId,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess,
          function () {}
        );
        cameraRunning = true;
        setScanMessage("カードのQRを読み取ってください。", false);
      } catch (error) {
        cameraRunning = false;
        setScanMessage("カメラを起動できません。カメラの使用を許可してください。", true);
        document.getElementById("cameraRetryBtn").style.display = "inline-block";
        console.error(error);
      }
    }

    async function stopCamera() {
      if (!scanner || !cameraRunning) return;
      try { await scanner.stop(); } catch (error) { console.error(error); }
      cameraRunning = false;
    }

    async function onScanSuccess(decodedText) {
      if (scanLocked) return;
      scanLocked = true;

      // QRコードの中身は「1」～「100」の数字だけにします。
      const cardText = String(decodedText).trim();
      if (!/^\d+$/.test(cardText)) {
        setScanMessage("このQRはカードではありません。", true);
        setTimeout(() => { scanLocked = false; setScanMessage("カードのQRを読み取ってください。", false); }, 1500);
        return;
      }

      const cardNumber = Number(cardText);
      if (!Number.isInteger(cardNumber) || cardNumber < 1 || cardNumber > 100) {
        setScanMessage("カード番号は1～100です。", true);
        setTimeout(() => { scanLocked = false; setScanMessage("カードのQRを読み取ってください。", false); }, 1500);
        return;
      }

      const password = document.getElementById("password").value;
      if (!password) {
        setScanMessage("左下のレジPWを入力してください。", true);
        setTimeout(() => { scanLocked = false; }, 1500);
        return;
      }

      setScanMessage("カードを確認しています…", false);
      try {
        const passwordOk = await runServer("checkPassword", password);
        if (!passwordOk) {
          alert("パスワードがちがいます。");
          setScanMessage("レジPWを確認してください。", true);
          setTimeout(() => { scanLocked = false; }, 1500);
          return;
        }

        const balance = await runServer("getBalance", cardNumber);
        currentCard = String(cardNumber);
        await stopCamera();
        playSound("https://pocket-se.info/se/barcode.mp3");

        document.getElementById("salesToday").style.display = "none";
        document.getElementById("card-area").style.display = "none";
        document.getElementById("cardNumberDisplay").textContent = "カード番号: " + currentCard;
        document.getElementById("balanceDisplay").textContent = Number(balance).toLocaleString();
        document.getElementById("pay-area").style.display = "block";
        document.getElementById("payment").focus();
      } catch (error) {
        alert(error.message);
        scanLocked = false;
        setScanMessage("もう一度読み取ってください。", true);
      }
    }

    async function doPayment() {
      const payButton = document.getElementById("payBtn");
      if (payButton.disabled) return;

      const paymentInput = document.getElementById("payment");
      const pay = Number(paymentInput.value);
      const password = document.getElementById("password").value;

      if (paymentInput.value === "" || !Number.isInteger(pay) || pay < 0) {
        alert("正しいお会計金額を入力してください。");
        return;
      }
      if (pay === 0) {
        showResult("とりけしました。", false);
        return;
      }

      payButton.disabled = true;
      playSound("https://pocket-se.info/se/barcode.mp3");

      try {
        const result = await runServer("processPayment", password, currentCard, pay);
        if (!result.success) {
          alert(result.message);
          if (typeof result.balance === "number") {
            document.getElementById("balanceDisplay").textContent = result.balance.toLocaleString();
          }
          payButton.disabled = false;
          return;
        }

        todaySales += pay;
        updateSalesDisplay();
        playSound("https://pocket-se.info/se/itemget5.mp3");
        showResult("残高：" + Number(result.newBalance).toLocaleString() + " 円", true);
      } catch (error) {
        alert(error.message);
        payButton.disabled = false;
      }
    }

    function showResult(message, paid) {
      document.getElementById("pay-area").style.display = "none";
      const result = document.getElementById("result");
      result.style.display = "block";
      result.textContent = paid ? "お会計できました！\n" + message : message;
      result.style.whiteSpace = "pre-line";
      setTimeout(resetScreen, 2500);
    }

    function cancelPayment() {
      document.getElementById("pay-area").style.display = "none";
      document.getElementById("result").style.display = "block";
      document.getElementById("result").textContent = "とりけしました。";
      setTimeout(resetScreen, 1000);
    }

    async function resetScreen() {
      currentCard = "";
      scanLocked = false;
      document.getElementById("result").style.display = "none";
      document.getElementById("card-area").style.display = "block";
      document.getElementById("payment").value = "";
      document.getElementById("payBtn").disabled = false;
      document.getElementById("salesToday").style.display = "block";
      await startCamera();
    }

    function updateSalesDisplay() {
      document.getElementById("salesToday").textContent =
        "このレジの今日の売上：" + todaySales.toLocaleString() + " 円";
    }

    function setScanMessage(message, isError) {
      const box = document.getElementById("scanMessage");
      box.textContent = message;
      box.style.background = isError ? "#fee2e2" : "#dbeafe";
      box.style.color = isError ? "#991b1b" : "#1e40af";
    }

    function playSound(url) {
      const audio = new Audio(url);
      audio.play().catch(error => console.log("音声再生エラー:", error));
    }

    window.addEventListener("load", startCamera);
  </script>
</body>
</html>
